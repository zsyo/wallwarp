[package]
name = "wallwarp"
version = "1.5.0"
authors = ["zsyo <zephyr@aico.top>"]
repository = "https://github.com/zsyo/wallwarp"
edition = "2024"
license = "AGPL-3.0"
readme = "README.md"
exclude = ["target/*", "cache/*", "data/*", "db/*", "logs/*", "*.log", "*.db"]

[dependencies]
iced = { version = "0.14", features = [
    "image",    # 需要显示图片
    "tokio",    # 异步任务（sleep等）运行时支持
    "canvas",   # 自定义绘图
    "advanced", # 启用高级功能
] }
iced_aw = { version = "0.14", features = ["number_input"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.22"
serde_json = "1.0"
image = { version = "0.25", features = ["webp"] }
toml = "1.1"
open = "5.4"
rfd = "0.17"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
fast_image_resize = { version = "6.1", features = ["image"] }
rayon = "1.12"
# native-tls：走系统 TLS 栈与证书库（Windows SChannel），代理/自签 CA 场景兼容性最好；
# system-proxy：无显式代理时自动读取 Windows/macOS 系统代理设置
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "system-proxy",
    "http2",
    "json",
    "stream",
    "brotli",
    "gzip",
] }
urlencoding = "2.1"
async-stream = "0.3"
wallpaper = "3.2"
rand = "0.10"
chrono = "0.4"
scopeguard = "1.2"
rusqlite = { version = "0.40", features = ["bundled"] }
interprocess = { version = "2.4", features = ["tokio"] }

# 托盘图标与原生菜单（三平台；Linux 需系统库 libayatana-appindicator3 / gtk3）
tray-icon = "0.24"

# 剪贴板（三平台原生实现，替代 cmd/clip 与 xclip 命令行方案）
arboard = "3"

# 平台标准目录（macOS/Linux 下定位应用数据根目录）
dirs = "6"

# i18n
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dark-light = "3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# gtk 特性启用 libappindicator 托盘后端；gtk crate 用于创建弹窗锚点窗口
tray-icon = { version = "0.24", features = ["gtk"] }
gtk = "0.18"
# X11 后端：悬浮球贴边所需的显示器几何与窗口移动
# （randr 特性查询显示器工作区；arboard/winit 也依赖 x11rb 0.13，保持同版本单一副本）
x11rb = { version = "0.13", features = ["randr"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
# 指定需要包含的资源文件
resources = ["locales"]
product_name = "WallWarp"
identifier = "top.aico.wallwarp"
category = "GraphicsAndDesign"
icons = ["assets/logo-*.png"]

# macOS：app bundle + dmg（CI 通过 --formats app,dmg 指定）
[package.metadata.packager.macos]
minimum_system_version = "10.15"

# RPM 打包（cargo-generate-rpm；cargo-packager 不支持 rpm 格式）
# 文件布局与 cargo-packager 生成的 deb 保持一致：
#   二进制 /usr/bin/wallwarp、资源 /usr/lib/wallwarp、
#   图标 /usr/share/icons/hicolor/<W>x<H>/apps/wallwarp.png、
#   桌面项 /usr/share/applications/wallwarp.desktop
# 二进制的 target/release/ 前缀会被 cargo-generate-rpm 按 --target
# 自动改写到 target/<triple>/release/，因此双架构共用本配置
[package.metadata.generate-rpm]
summary = "WallWarp 桌面壁纸管理软件"
release = "1"
auto-req = "no"
require-sh = false
assets = [
    { source = "target/release/wallwarp", dest = "/usr/bin/wallwarp", mode = "755" },
    { source = "locales/*.ftl", dest = "/usr/lib/wallwarp/locales/", mode = "644" },
    { source = "packaging/linux/wallwarp.desktop", dest = "/usr/share/applications/wallwarp.desktop", mode = "644" },
    { source = "assets/logo-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/wallwarp.png", mode = "644" },
    { source = "assets/logo-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/wallwarp.png", mode = "644" },
    { source = "assets/logo-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/wallwarp.png", mode = "644" },
    { source = "assets/logo-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/wallwarp.png", mode = "644" },
    { source = "assets/logo-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/wallwarp.png", mode = "644" },
    { source = "assets/logo-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/wallwarp.png", mode = "644" },
]
