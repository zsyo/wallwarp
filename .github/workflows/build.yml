name: Build

# 构建验证工作流：不打包、不发布，仅验证三平台六目标能否编译通过
# （日常编译把关；打包演练用 release.yml 的 workflow_dispatch，
#  完整发布用 release.yml 的 tag 流程）

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消仍在跑的旧任务，节省 runner 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64（x86-64-v3 指令级优化，与发布构建一致）
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v3"
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: ""
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""
          # macOS x64：arm64 runner 交叉编译
          - name: macOS-x64
            os: macos-14
            target: x86_64-apple-darwin
            rustflags: ""
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ""

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          # 自动开启依赖缓存
          cache: true

      - name: Ensure Rust target
        # 兜底：macOS x64 任务在 arm64 runner 上交叉编译，
        # setup-rust-toolchain 的 targets 输入在该组合下可能未安装目标
        if: runner.os == 'Macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gtk3/appindicator：托盘；rsvg：图标渲染；xkbcommon/x11/wayland：iced/winit
          # libssl-dev + pkg-config：reqwest native-tls（OpenSSL）构建依赖
          # （仅构建验证，无需打包用的 libarchive-tools/zstd）
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev cmake \
            libssl-dev pkg-config libxdo-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
