name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    outputs:
      # 跨 job 传递预发布标志（release job 使用；矩阵各任务输出相同取其一）
      prerelease: ${{ steps.version.outputs.prerelease }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS 安装器 + 便携 zip（x86-64-v3 指令级优化）
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            arch: x64
            rustflags: "-C target-cpu=x86-64-v3"
          # Windows arm64：NSIS 安装器 + 便携 zip
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: nsis
            arch: arm64
            rustflags: ""
          # macOS 双架构：app bundle + dmg（同机交叉编译 x64）
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            formats: app,dmg
            arch: arm64
            rustflags: ""
          - name: macOS-x64
            os: macos-14
            target: x86_64-apple-darwin
            formats: app,dmg
            arch: x64
            rustflags: ""
          # Linux x64：AppImage + deb + rpm + pacman（x86-64-v3 指令级优化）
          # rpm 由 cargo-generate-rpm 单独生成（cargo-packager 不支持 rpm）；
          # pacman 由 CI 在 cargo-packager 数据上装配（见 Package Pacman 步骤）
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb,pacman
            arch: x64
            rustflags: "-C target-cpu=x86-64-v3"
          # Linux arm64：AppImage + deb + rpm + pacman（原生 arm runner）
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            formats: appimage,deb,pacman
            arch: arm64
            rustflags: ""

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 输入名为 target（支持逗号分隔；此前误写 targets 未生效，
          # 导致 macOS 交叉编译时目标标准库未安装）
          target: ${{ matrix.target }}
          # 自动开启依赖缓存
          cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gtk3/appindicator：托盘；rsvg：图标渲染；xkbcommon/x11/wayland：iced/winit
          # libssl-dev + pkg-config：reqwest native-tls（OpenSSL）构建依赖
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev cmake \
            libssl-dev pkg-config libxdo-dev \
            libarchive-tools zstd

      - name: Install Tools
        # 使用快速安装工具，避免从源码编译 cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Install RPM packaging tool
        # cargo-generate-rpm 无预编译发布产物（install-action/binstall 不可用），
        # 源码安装；配合 Cargo.toml 的 [package.metadata.generate-rpm] 使用。
        # 清空 RUSTFLAGS，避免 x86-64-v3 指令级优化影响工具在 runner 上的运行
        if: runner.os == 'Linux'
        run: RUSTFLAGS="" cargo install cargo-generate-rpm --locked

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            version="${BASH_REMATCH[1]}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            # 预发布判定：tag 版本号含 '_' 分隔符即为预发布
            # （如 v1.5.1_beta.1 / v1.5.1_rc2；v1.5.1 这类不含 '_' 的为正式版）
            # 注：不用 '-'，因为 RPM Version 字段与 pacman pkgver 均禁止 '-'
            if [[ "$version" == *_* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # 显示版本：Cargo.toml 恒为干净版本，预发布身份仅经此注入
          # （未传时 build.rs 回退 CARGO_PKG_VERSION）
          WALLWARP_DISPLAY_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: >
          cargo packager --release --formats ${{ matrix.formats }}
          --target ${{ matrix.target }}

      - name: Package RPM
        # 布局见 Cargo.toml [package.metadata.generate-rpm]；
        # 二进制路径会按 --target 自动改写为 target/<triple>/release/wallwarp
        if: runner.os == 'Linux'
        run: cargo generate-rpm --target ${{ matrix.target }}

      - name: Package Pacman
        # cargo-packager 的 pacman 格式只产出 PKGBUILD + 数据 tar.gz（用户仍需
        # 本机 makepkg），因此在其数据基础上直接装配标准 pacman 包：
        # .PKGINFO + .MTREE（bsdtar 生成，与 makepkg 同参，含 md5/sha256 摘要）
        # + 数据目录 → zstd 压缩 tar，产物可直接 pacman -U 安装
        # （xdotool 提供 libxdo，muda 菜单运行时动态链接）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # pacman pkgver 只允许字母数字与 . _ +（'-' 保留为 pkgrel 分隔符），
          # 防御性清洗预发布 tag 中的非法字符（当前规范用 '_'，本身合法）
          pkgver="${version//[^[:alnum:].+_]/_}"
          out_dir="target/${{ matrix.target }}/release"
          case "${{ matrix.arch }}" in
            x64) pkg_arch="x86_64" ;;
            arm64) pkg_arch="aarch64" ;;
            *) echo "未知架构: ${{ matrix.arch }}"; exit 1 ;;
          esac

          shopt -s nullglob
          data_tars=("$out_dir"/wallwarp_*_*.tar.gz)
          shopt -u nullglob
          if [ ${#data_tars[@]} -ne 1 ]; then
            echo "期望恰好 1 个 pacman 数据包，实际 ${#data_tars[@]} 个"; exit 1
          fi

          mkdir -p pacman-pkg dist
          tar -xzf "${data_tars[0]}" -C pacman-pkg
          installed_size="$(du -sb pacman-pkg | cut -f1)"

          cat > pacman-pkg/.PKGINFO <<EOF
          pkgname = wallwarp
          pkgbase = wallwarp
          pkgver = ${pkgver}-1
          pkgdesc = WallWarp 桌面壁纸管理软件
          url = https://github.com/zsyo/wallwarp
          builddate = $(date +%s)
          packager = zsyo <zephyr@aico.top>
          size = ${installed_size}
          arch = ${pkg_arch}
          license = AGPL-3.0
          depend = gtk3
          depend = libayatana-appindicator
          depend = openssl
          depend = xdotool
          xdata = pkgtype=pkg
          EOF

          # .MTREE 与 makepkg 相同方式生成（文件+目录，bsdtar mtree 格式）
          (cd pacman-pkg && find .PKGINFO usr | LC_ALL=C sort | \
            bsdtar --uid 0 --uname root --gid 0 --gname root -czf .MTREE \
            --format=mtree \
            --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' -T -)

          pkg_file="dist/wallwarp-${pkgver}-1-linux_${pkg_arch}.pkg.tar.zst"
          # .PKGINFO 必须是首个条目；包内属主归零（makepkg/fakeroot 语义）
          tar --zstd --owner=0 --group=0 --numeric-owner -cf "$pkg_file" \
            -C pacman-pkg .PKGINFO .MTREE usr
          # 清理 cargo-packager 的中间产物（tar.gz + PKGBUILD）
          rm -f "${data_tars[0]}" "$out_dir/PKGBUILD"
          echo "[pacman] 已生成 $pkg_file"

      - name: Create portable zip (Windows)
        # 命名与安装器对齐：wallwarp_{version}_windows_{arch}-portable.zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $portableDir = "wallwarp_${version}_windows_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $portableDir

          $filesToInclude = @("target/${{ matrix.target }}/release/wallwarp.exe", "locales")
          foreach ($file in $filesToInclude) {
              if (Test-Path $file) {
                  Copy-Item -Path $file -Destination "$portableDir/" -Recurse
              } else {
                  Write-Error "Required file $file not found!"
                  exit 1
              }
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath "$portableDir.zip"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # 统一收集各平台安装包产物
          find target/${{ matrix.target }}/release \
            -maxdepth 2 -type f \( \
              -name "*-setup.exe" -o \
              -name "*.dmg" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.app.tar.gz" \) \
            -exec cp {} dist/ \;
          # rpm 由 cargo-generate-rpm 输出到 target/<triple>/generate-rpm/
          # （仅 Linux 存在该目录，其它平台忽略 find 报错）
          find target/${{ matrix.target }}/generate-rpm \
            -type f -name "*.rpm" \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Rename installers
        # 统一产物命名：版本号替换为 tag 版本（Cargo.toml 恒为干净版本，
        # 预发布仅体现在 tag），并在架构前补平台名（windows/macos/linux）。
        # 各格式默认名与映射（matrix.arch 为 x64/arm64）：
        #   NSIS      wallwarp_{v}_{arch}-setup.exe       -> wallwarp_{tv}_windows_{arch}-setup.exe
        #   dmg       WallWarp_{v}_{arch}.dmg             -> wallwarp_{tv}_macos_{arch}.dmg
        #   app       WallWarp.app.tar.gz（无版本无架构）  -> wallwarp_{tv}_macos_{arch}.app.tar.gz
        #   AppImage  wallwarp_{v}_{deb_arch}.AppImage    -> wallwarp_{tv}_linux_{arch}.AppImage
        #   deb       wallwarp_{v}_{deb_arch}.deb         -> wallwarp_{tv}_linux_{arch}.deb
        #   rpm       wallwarp-{v}-1.{rpm_arch}.rpm       -> wallwarp-{tv}-1-linux_{arch}.rpm
        # pacman 在 Package Pacman 步骤已按 linux_{arch} 生成
        shell: bash
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          arch="${{ matrix.arch }}"
          echo "Cargo.toml 版本: $cargo_version -> tag 版本: $TAG_VERSION (arch=$arch)"
          rename() {
            local base new
            base=$(basename "$1")
            new="${base/$cargo_version/$TAG_VERSION}"
            [ "$base" != "$new" ] && mv "dist/$base" "dist/$new" && return
            mv "dist/$base" "dist/$new"
          }

          # deb：Debian 架构名（amd64/arm64）+ 版本替换为 tag 版本
          for f in dist/*.deb; do
            [ -e "$f" ] || continue
            new="${f/$cargo_version/$TAG_VERSION}"
            new="${new/_amd64./_linux_x64.}"; new="${new/_arm64./_linux_arm64.}"
            if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
          done

          # AppImage：upstream arch（x86_64/aarch64）+ 版本替换为 tag 版本
          for f in dist/*.AppImage; do
            [ -e "$f" ] || continue
            new="${f/$cargo_version/$TAG_VERSION}"
            new="${new/_x86_64./_linux_x64.}"; new="${new/_aarch64./_linux_arm64.}"
            if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
          done

          # dmg：cargo-packager 用 product_name（WallWarp_）与 x64/aarch64 架构名
          for f in dist/*.dmg; do
            [ -e "$f" ] || continue
            new="${f/WallWarp_/wallwarp_}"
            new="${new/$cargo_version/$TAG_VERSION}"
            new="${new/_x64./_macos_x64.}"; new="${new/_aarch64./_macos_arm64.}"
            if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
          done

          # app bundle 归档（WallWarp.app.tar.gz，无版本无架构）
          for f in dist/*.app.tar.gz; do
            [ -e "$f" ] || continue
            mv "$f" "dist/wallwarp_${TAG_VERSION}_macos_${arch}.app.tar.gz"
          done

          # rpm：连字符风格，rpm 架构名（x86_64/aarch64）+ 版本替换为 tag 版本
          # 输出如 wallwarp-1.6.0_beta.1-1-linux_x64.rpm
          for f in dist/*.rpm; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            new="${base/$cargo_version/$TAG_VERSION}"
            new="${new/.x86_64.rpm/-linux_x64.rpm}"
            new="${new/.aarch64.rpm/-linux_arm64.rpm}"
            if [ "$base" != "$new" ]; then
              mv "dist/$base" "dist/$new"
            fi
          done

          # NSIS：沿用原逻辑（版本替换 + windows 平台名）
          for f in dist/*-setup.exe; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            new="${base/$cargo_version/$TAG_VERSION}"
            new="${new/_x64-setup.exe/_windows_x64-setup.exe}"
            new="${new/_arm64-setup.exe/_windows_arm64-setup.exe}"
            if [ "$base" != "$new" ]; then
              mv "dist/$base" "dist/$new"
            fi
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ matrix.name }}
          path: |
            dist/*
            wallwarp_*-portable.zip

  # 独立发布 job：全部构建任务成功后仅执行一次，避免 6 个矩阵任务
  # 并发创建/更新同一 Release 导致 generate_release_notes 反复追加
  # （Release 页出现多行 "Full Changelog"）
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-packages-*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # artifacts/release-packages-*/ 下已包含全部平台的产物
          # （含便携 zip）；dist/** 通配直接取到所有文件
          files: artifacts/release-packages-*/**
          draft: false
          # tag 版本号含 '_'（如 v1.5.1_beta.1）时标记为预发布
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
