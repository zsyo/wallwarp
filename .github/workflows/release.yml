name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS 安装器 + 便携 zip（x86-64-v3 指令级优化）
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            rustflags: "-C target-cpu=x86-64-v3"
          # Windows arm64：NSIS 安装器
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: nsis
            rustflags: ""
          # macOS 双架构：app bundle + dmg（同机交叉编译 x64）
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            formats: app,dmg
            rustflags: ""
          - name: macOS-x64
            os: macos-14
            target: x86_64-apple-darwin
            formats: app,dmg
            rustflags: ""
          # Linux x64：AppImage（x86-64-v3 指令级优化）
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: appimage
            rustflags: "-C target-cpu=x86-64-v3"
          # Linux arm64：AppImage（原生 arm runner）
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            formats: appimage
            rustflags: ""

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          # 自动开启依赖缓存
          cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gtk3/appindicator：托盘；rsvg：图标渲染；xkbcommon/x11/wayland：iced/winit
          # libssl-dev + pkg-config：reqwest native-tls（OpenSSL）构建依赖
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev cmake \
            libssl-dev pkg-config libxdo-dev

      - name: Install Tools
        # 使用快速安装工具，避免从源码编译 cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: >
          cargo packager --release --formats ${{ matrix.formats }}
          --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create portable zip (Windows x64 only)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $portableDir = "wallwarp-portable-windows-x64-$version"
          New-Item -ItemType Directory -Force -Path $portableDir

          $filesToInclude = @("target/${{ matrix.target }}/release/wallwarp.exe", "locales")
          foreach ($file in $filesToInclude) {
              if (Test-Path $file) {
                  Copy-Item -Path $file -Destination "$portableDir/" -Recurse
              } else {
                  Write-Error "Required file $file not found!"
                  exit 1
              }
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath "$portableDir.zip"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # 统一收集各平台安装包产物
          find target/${{ matrix.target }}/release \
            -maxdepth 2 -type f \( \
              -name "*-setup.exe" -o \
              -name "*.dmg" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.app.tar.gz" \) \
            -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.name }}
          path: |
            dist/*
            wallwarp-portable-windows-x64-*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            wallwarp-portable-windows-x64-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
